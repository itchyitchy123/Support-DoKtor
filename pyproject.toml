[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "support-doctor"
version = "0.1.0"
description = "Read-first Linux hosting diagnostics and recovery planning for cPanel, CWP, and VPS servers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Support DoKtor" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "linux",
  "sysadmin",
  "troubleshooting",
  "incident-response",
  "observability",
  "python",
  "cpanel",
  "web-hosting",
  "diagnostics",
  "site-reliability-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]
dependencies = []
[project.urls]
Homepage = "https://github.com/itchyitchy123/Support-DoKtor"
Repository = "https://github.com/itchyitchy123/Support-DoKtor"
Issues = "https://github.com/itchyitchy123/Support-DoKtor/issues"
Changelog = "https://github.com/itchyitchy123/Support-DoKtor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
support-doctor = "support_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["support_doctor"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
